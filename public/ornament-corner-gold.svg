<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2B3"/>
      <stop offset="22%" stop-color="#F4D56A"/>
      <stop offset="45%" stop-color="#D4A72C"/>
      <stop offset="68%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#FFE08A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7a5a00" flood-opacity="0.25"/>
    </filter>
    <g id="petal">
      <path d="M0 0 C 12 -30, 42 -54, 70 -58 C 48 -34, 30 -10, 0 0 Z" fill="url(#gold)"/>
      <path d="M0 0 C 12 -30, 42 -54, 70 -58" stroke="#9A6A00" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="curl">
      <path d="M0 0 C 30 -10, 52 -34, 54 -60 C 56 -88, 32 -104, 10 -96 C -8 -90, -8 -66, 12 -64 C 24 -63, 30 -72, 28 -80" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="berry">
      <circle cx="0" cy="0" r="11" fill="#C79516" stroke="#9A6A00" stroke-width="3"/>
      <circle cx="-3" cy="-3" r="3" fill="#FFF2B3" opacity="0.75"/>
    </g>
    <g id="flower">
      <circle cx="0" cy="0" r="20" fill="#F4D56A" stroke="#9A6A00" stroke-width="5"/>
      <g>
        <use href="#petal" transform="rotate(0) translate(18 0)"/>
        <use href="#petal" transform="rotate(45) translate(18 0)"/>
        <use href="#petal" transform="rotate(90) translate(18 0)"/>
        <use href="#petal" transform="rotate(135) translate(18 0)"/>
        <use href="#petal" transform="rotate(180) translate(18 0)"/>
        <use href="#petal" transform="rotate(225) translate(18 0)"/>
        <use href="#petal" transform="rotate(270) translate(18 0)"/>
        <use href="#petal" transform="rotate(315) translate(18 0) scale(1 -1)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="#9A6A00"/>
    </g>
    <g id="half-ornament" filter="url(#shadow)">
      <path d="M0 0 C 120 -18, 226 -70, 314 -146" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 0 C 128 18, 236 70, 322 146" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
      <use href="#curl" transform="translate(78 -18) rotate(-15) scale(1.2)"/>
      <use href="#curl" transform="translate(146 18) rotate(28) scale(1.1 -1)"/>
      <use href="#curl" transform="translate(230 -58) rotate(-8) scale(0.95)"/>
      <use href="#petal" transform="translate(128 -42) rotate(-24) scale(1.2)"/>
      <use href="#petal" transform="translate(204 52) rotate(34) scale(1.1 -1)"/>
      <use href="#petal" transform="translate(262 -92) rotate(-16) scale(1.15)"/>
      <use href="#berry" transform="translate(102 -10)"/>
      <use href="#berry" transform="translate(176 30)"/>
      <use href="#berry" transform="translate(242 -72)"/>
      <use href="#flower" transform="translate(336 0) scale(1.18)"/>
    </g>
  </defs>

  <rect width="1600" height="500" fill="#fffdf7"/>

  <g transform="translate(800 250)">
    <path d="M-520 0 H520" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" filter="url(#shadow)"/>

    <use href="#half-ornament" transform="translate(-170 0)"/>
    <use href="#half-ornament" transform="translate(170 0) scale(-1 1)"/>

    <use href="#flower" transform="translate(0 0) scale(1.45)" filter="url(#shadow)"/>

    <use href="#petal" transform="translate(-72 -92) rotate(-110) scale(1.25)"/>
    <use href="#petal" transform="translate(72 -92) rotate(-70) scale(1.25) scale(-1 1)"/>
    <use href="#petal" transform="translate(-72 92) rotate(110) scale(1.25) scale(1 -1)"/>
    <use href="#petal" transform="translate(72 92) rotate(70) scale(1.25) scale(-1 -1)"/>

    <use href="#berry" transform="translate(-96 0)"/>
    <use href="#berry" transform="translate(96 0)"/>

    <use href="#curl" transform="translate(-420 -8) rotate(180) scale(1.2)"/>
    <use href="#curl" transform="translate(420 8) scale(1.2)"/>
  </g>
</svg>
